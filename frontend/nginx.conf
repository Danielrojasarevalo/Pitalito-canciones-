server {
  listen 80;
  server_name _;
  client_max_body_size 60m;
  root /usr/share/nginx/html;

  # API y panel de Django
  location ~ ^/(api|admin)/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }
  # WebSockets (cola en tiempo real)
  location /ws/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 1d;
  }
  # Audios, portadas y archivos estáticos de Django (servidos directo por Nginx)
  location /media/ { alias /data/media/; add_header Access-Control-Allow-Origin *; expires 7d; }
  location /static/ { alias /data/static/; expires 7d; }

  # Aplicación Angular
  location / { try_files $uri $uri/ /index.html; }
}
