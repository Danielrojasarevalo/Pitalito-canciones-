# Despliegue completo en el servidor:
#   cp .env.example .env   (y edita los valores)
#   docker compose up -d --build
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-cancionespita}
      POSTGRES_USER: ${DB_USER:-pitalito}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pitalito} -d ${DB_NAME:-cancionespita}"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-cambia-esta-clave}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "*"
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-cancionespita}
      DB_USER: ${DB_USER:-pitalito}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - media:/app/media
      - static:/app/staticfiles

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on: [backend]
    volumes:
      - media:/data/media:ro
      - static:/data/static:ro

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [frontend]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  media:
  static:
  caddy_data:
  caddy_config:
